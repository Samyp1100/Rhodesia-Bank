<div class="container mt-4">
  <div class="row mb-4">
    <div class="col">
      <h2 class="mb-0">
        <i class="bi bi-book-half"></i> Gestión de Libros
      </h2>
    </div>
    <div class="col-auto">
      <button class="btn btn-primary" (click)="mostrarFormularioCrear()" *ngIf="!mostrarFormulario">
        <i class="bi bi-plus-circle"></i> Nuevo Libro
      </button>
    </div>
  </div>

  <!-- Formulario de creación/edición -->
  <div class="card mb-4" *ngIf="mostrarFormulario">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">
        <i class="bi bi-{{ modoEdicion ? 'pencil' : 'plus-circle' }}"></i>
        {{ modoEdicion ? 'Editar Libro' : 'Nuevo Libro' }}
      </h5>
    </div>
    <div class="card-body">
      <form (ngSubmit)="guardar()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="titulo" class="form-label">Título *</label>
            <input
              type="text"
              class="form-control"
              id="titulo"
              [(ngModel)]="nuevoLibro.titulo"
              name="titulo"
              required
              placeholder="Ej: Cien años de soledad"
            >
          </div>
          <div class="col-md-3 mb-3">
            <label for="isbn" class="form-label">ISBN *</label>
            <input
              type="text"
              class="form-control"
              id="isbn"
              [(ngModel)]="nuevoLibro.isbn"
              name="isbn"
              required
              placeholder="978-0307474728"
            >
          </div>
          <div class="col-md-3 mb-3">
            <label for="anio" class="form-label">Año</label>
            <input
              type="number"
              class="form-control"
              id="anio"
              [(ngModel)]="nuevoLibro.anio"
              name="anio"
              min="1000"
              max="2100"
            >
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Autores</label>
          <div class="border rounded p-3" style="max-height: 200px; overflow-y: auto;">
            <div class="form-check" *ngFor="let autor of autores">
              <input
                class="form-check-input"
                type="checkbox"
                [id]="'autor-' + autor.id"
                [checked]="isAutorSeleccionado(autor.id!)"
                (change)="toggleAutor(autor.id!)"
              >
              <label class="form-check-label" [for]="'autor-' + autor.id">
                {{ autor.nombre }} <span class="text-muted">({{ autor.nacionalidad }})</span>
              </label>
            </div>
            <div *ngIf="autores.length === 0" class="text-muted text-center py-2">
              No hay autores disponibles. <a routerLink="/autores">Crear autor</a>
            </div>
          </div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success">
            <i class="bi bi-check-circle"></i> Guardar
          </button>
          <button type="button" class="btn btn-secondary" (click)="cancelar()">
            <i class="bi bi-x-circle"></i> Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Tabla de libros -->
  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Título</th>
              <th>ISBN</th>
              <th>Año</th>
              <th>Autores</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let libro of libros">
              <td>{{ libro.id }}</td>
              <td>
                <i class="bi bi-book text-primary"></i>
                <strong>{{ libro.titulo }}</strong>
              </td>
              <td>
                <code>{{ libro.isbn }}</code>
              </td>
              <td>
                <span class="badge bg-secondary">{{ libro.anio }}</span>
              </td>
              <td>
                <span class="text-muted">{{ obtenerNombresAutores(libro) }}</span>
              </td>
              <td class="text-end">
                <div class="btn-group" role="group">
                  <button
                    class="btn btn-sm btn-warning"
                    (click)="mostrarFormularioEditar(libro)"
                    title="Editar"
                  >
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button
                    class="btn btn-sm btn-danger"
                    (click)="eliminar(libro.id)"
                    title="Eliminar"
                  >
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
        <div *ngIf="libros.length === 0" class="text-center py-5 text-muted">
          <i class="bi bi-inbox" style="font-size: 3rem;"></i>
          <p class="mt-3">No hay libros registrados</p>
        </div>
      </div>
    </div>
  </div>
</div>
