<div class="container mt-4">
  <div class="row mb-4">
    <div class="col">
      <h2 class="mb-0">
        <i class="bi bi-people"></i> Gestión de Autores
      </h2>
    </div>
    <div class="col-auto">
      <button class="btn btn-primary" (click)="mostrarFormularioCrear()" *ngIf="!mostrarFormulario">
        <i class="bi bi-plus-circle"></i> Nuevo Autor
      </button>
    </div>
  </div>

  <!-- Formulario de creación/edición -->
  <div class="card mb-4" *ngIf="mostrarFormulario">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">
        <i class="bi bi-{{ modoEdicion ? 'pencil' : 'plus-circle' }}"></i>
        {{ modoEdicion ? 'Editar Autor' : 'Nuevo Autor' }}
      </h5>
    </div>
    <div class="card-body">
      <form (ngSubmit)="guardar()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="nombre" class="form-label">Nombre *</label>
            <input
              type="text"
              class="form-control"
              id="nombre"
              [(ngModel)]="nuevoAutor.nombre"
              name="nombre"
              required
              placeholder="Ej: Gabriel García Márquez"
            >
          </div>
          <div class="col-md-6 mb-3">
            <label for="nacionalidad" class="form-label">Nacionalidad</label>
            <input
              type="text"
              class="form-control"
              id="nacionalidad"
              [(ngModel)]="nuevoAutor.nacionalidad"
              name="nacionalidad"
              placeholder="Ej: Colombiano"
            >
          </div>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success">
            <i class="bi bi-check-circle"></i> Guardar
          </button>
          <button type="button" class="btn btn-secondary" (click)="cancelar()">
            <i class="bi bi-x-circle"></i> Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Tabla de autores -->
  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Nacionalidad</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let autor of autores">
              <td>{{ autor.id }}</td>
              <td>
                <i class="bi bi-person-fill text-primary"></i>
                {{ autor.nombre }}
              </td>
              <td>
                <span class="badge bg-info">{{ autor.nacionalidad || 'No especificada' }}</span>
              </td>
              <td class="text-end">
                <div class="btn-group" role="group">
                  <button
                    class="btn btn-sm btn-warning"
                    (click)="mostrarFormularioEditar(autor)"
                    title="Editar"
                  >
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button
                    class="btn btn-sm btn-danger"
                    (click)="eliminar(autor.id)"
                    title="Eliminar"
                  >
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
        <div *ngIf="autores.length === 0" class="text-center py-5 text-muted">
          <i class="bi bi-inbox" style="font-size: 3rem;"></i>
          <p class="mt-3">No hay autores registrados</p>
        </div>
      </div>
    </div>
  </div>
</div>
